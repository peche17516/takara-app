    /* ================= TICKET LEDGER (SUMMARY + FILTER + MANUAL ENTRY + BACKUP) ================= */
    function saveTicketToLedger(rec, betType, silent = false) {
      const type = APP_STATE.currentType;
      const cfg = LOTTERY_CONFIG[type];
      const ticket = {
        id: Date.now() + '_' + Math.floor(Math.random() * 100000),
        type,
        typeName: cfg.name,
        round: APP_STATE.selectedRound,
        rank: rec.rank,
        betType: betType || null,
        numbers: [...rec.numbers],
        savedAt: formatDateWithWeekday(new Date())
      };
      APP_STATE.tickets.unshift(ticket);
      persistTickets();
      updateLedgerBadge();
      if (!silent) {
        const betLabel = ticket.betType ? `【${ticket.betType}】` : '';
        showToast(`📒 ${cfg.name} 第${ticket.round}回（${rec.rank}）${betLabel}を購入台帳に記録しました`);
      }
    }

    function persistTickets() {
      try {
        localStorage.setItem('lottery_pred_tickets_v2', JSON.stringify(APP_STATE.tickets));
      } catch (e) {}
    }

    function updateLedgerBadge() {
      document.getElementById('ledgerCountBadge').textContent = APP_STATE.tickets.length;
    }

    function exportBackupCode() {
      if (APP_STATE.tickets.length === 0) {
        SOUND_FX.play('limit');
        showToast('バックアップする購入記録がまだありません');
        return;
      }
      try {
        const jsonStr = JSON.stringify(APP_STATE.tickets);
        const encoded = 'LOTTO_BK_' + btoa(unescape(encodeURIComponent(jsonStr)));
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(encoded).then(() => {
            SOUND_FX.play('coin');
            showToast('📋 バックアップコードをコピーしました（LINEメモ等に保存可）');
          }).catch(() => fallbackCopyText(encoded));
        } else {
          fallbackCopyText(encoded);
        }
      } catch (e) {
        SOUND_FX.play('limit');
        showToast('バックアップ作成に失敗しました');
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      SOUND_FX.play('coin');
      showToast('📋 バックアップコードをコピーしました');
    }

    function importBackupCode(rawCode) {
      const trimmed = (rawCode || '').trim();
      if (!trimmed.startsWith('LOTTO_BK_')) {
        SOUND_FX.play('limit');
        showToast('正しいバックアップコード（LOTTO_BK_...）を貼り付けてください');
        return;
      }
      try {
        const b64 = trimmed.replace('LOTTO_BK_', '');
        const jsonStr = decodeURIComponent(escape(atob(b64)));
        const parsed = JSON.parse(jsonStr);
        if (!Array.isArray(parsed)) throw new Error('Invalid format');

        const existingIds = new Set(APP_STATE.tickets.map(t => t.id));
        let restoredCount = 0;
        parsed.forEach(item => {
          if (item && item.id && !existingIds.has(item.id)) {
            APP_STATE.tickets.push(item);
            restoredCount++;
          }
        });
        persistTickets();
        updateLedgerBadge();
        SOUND_FX.play('coin');
        openLedgerModal();
        showToast(`📥 ${restoredCount}件の購入記録を復元・最新結果と再照合しました`);
      } catch (e) {
        SOUND_FX.play('limit');
        showToast('バックアップコードの復元に失敗しました');
      }
    }

    function evaluateTicketMatch(ticket) {
      const history = APP_STATE.historyData[ticket.type] || [];
      const official = history.find(d => d.round === ticket.round);
      if (!official) {
        return { status: 'pending', label: '抽選待ち（未確定）', official: null };
      }

      const type = ticket.type;
      if (type === 'numbers3' || type === 'numbers4') {
        const isMiniTicket = (type === 'numbers3' && (ticket.betType === 'ミニ' || ticket.numbers[0] === null));
        const isMini = type === 'numbers3' && ticket.numbers[1] === official.main[1] && ticket.numbers[2] === official.main[2];

        if (isMiniTicket) {
          if (isMini) return { status: 'win', label: '🎉 ミニ当選（下2桁一致）！', official };
          return { status: 'lose', label: '落選（下2桁不一致）', official };
        }

        let straightHits = 0;
        ticket.numbers.forEach((n, idx) => {
          if (n !== null && official.main[idx] === n) straightHits++;
        });
        const isStraight = straightHits === ticket.numbers.length;
        const sortedUser = [...ticket.numbers].sort().join(',');
        const sortedOff = [...official.main].sort().join(',');
        const isBox = sortedUser === sortedOff;

        const bt = ticket.betType;

        if (bt === 'ストレート') {
          if (isStraight) return { status: 'win', label: '🎉 ストレート当選！', official };
          if (isBox) return { status: 'lose', label: '惜敗（ボックス一致／ストレート購入）', official };
          if (isMini) return { status: 'lose', label: '惜敗（下2桁一致／ストレート購入）', official };
          return { status: 'lose', label: straightHits > 0 ? `落選（${straightHits}桁位置一致）` : '落選（0桁一致）', official };
        }

        if (bt === 'ボックス') {
          if (isStraight) return { status: 'win', label: '🎉 ボックス当選！（数字・並び完全一致）', official };
          if (isBox) return { status: 'win', label: '🎉 ボックス当選！', official };
          return { status: 'lose', label: straightHits > 0 ? `落選（${straightHits}桁位置一致）` : '落選（不一致）', official };
        }

        if (bt === 'セット') {
          if (isStraight) return { status: 'win', label: '🎉 セット（ストレート）当選！', official };
          if (isBox) return { status: 'win', label: '🎉 セット（ボックス）当選！', official };
          return { status: 'lose', label: straightHits > 0 ? `落選（${straightHits}桁位置一致）` : '落選（不一致）', official };
        }

        if (isStraight) return { status: 'win', label: '🎉 ストレート当選！', official };
        if (isBox) return { status: 'win', label: '🎉 ボックス当選！', official };
        if (isMini) return { status: 'win', label: '🎉 ミニ当選（下2桁）！', official };
        return {
          status: 'lose',
          label: straightHits > 0 ? `落選（${straightHits}桁位置一致）` : '落選（0桁一致）',
          official
        };
      }

      if (type === 'bingo5') {
        let slotHits = 0;
        ticket.numbers.forEach((n, idx) => {
          if (official.main[idx] === n) slotHits++;
        });
        const lines = [
          [0, 1, 2], [5, 6, 7],
          [0, 3, 5], [2, 4, 7],
          [3, 4], [1, 6], [0, 7], [2, 5]
        ];
        let bingoLines = 0;
        lines.forEach(line => {
          if (line.every(idx => ticket.numbers[idx] === official.main[idx])) {
            bingoLines++;
          }
        });
        if (bingoLines > 0) {
          return { status: 'win', label: `🎉 ${bingoLines}ライン ビンゴ当選！（${slotHits}マス一致）`, official };
        }
        return {
          status: 'lose',
          label: `落選（${slotHits}マス一致 / 0ライン）`,
          official
        };
      }

      const mainHits = ticket.numbers.filter(n => official.main.includes(n)).length;
      const bonusHits = (official.bonus || []).filter(b => ticket.numbers.includes(b)).length;

      let tierText = '';
      if (type === 'loto6') {
        if (mainHits === 6) tierText = '🎉 1等当選！';
        else if (mainHits === 5 && bonusHits >= 1) tierText = '🎉 2等当選！';
        else if (mainHits === 5) tierText = '🎉 3等当選！';
        else if (mainHits === 4) tierText = '🎉 4等当選！';
        else if (mainHits === 3) tierText = '🎉 5等当選！';
      } else if (type === 'loto7') {
        if (mainHits === 7) tierText = '🎉 1等当選！';
        else if (mainHits === 6 && bonusHits >= 1) tierText = '🎉 2等当選！';
        else if (mainHits === 6) tierText = '🎉 3等当選！';
        else if (mainHits === 5) tierText = '🎉 4等当選！';
        else if (mainHits === 4) tierText = '🎉 5等当選！';
        else if (mainHits === 3 && bonusHits >= 1) tierText = '🎉 6等当選！';
      } else if (type === 'miniloto') {
        if (mainHits === 5) tierText = '🎉 1等当選！';
        else if (mainHits === 4 && bonusHits >= 1) tierText = '🎉 2等当選！';
        else if (mainHits === 4) tierText = '🎉 3等当選！';
        else if (mainHits === 3) tierText = '🎉 4等当選！';
      }

      if (tierText) {
        return { status: 'win', label: `${tierText}（本${mainHits}${bonusHits ? `+B${bonusHits}` : ''}）`, official };
      }
      return {
        status: 'lose',
        label: `落選（本数字${mainHits}個${bonusHits ? `・B${bonusHits}個` : ''}一致）`,
        official
      };
    }

    function openLedgerModal() {
      const body = document.getElementById('ledgerModalBody');

      let winCount = 0;
      let judgedCount = 0;
      APP_STATE.tickets.forEach(t => {
        const res = evaluateTicketMatch(t);
        if (res.status === 'win') {
          winCount++;
          judgedCount++;
        } else if (res.status === 'lose') {
          judgedCount++;
        }
      });
      const winRateStr = judgedCount > 0 ? `${Math.round((winCount / judgedCount) * 100)}%` : '-';

      const statsDashboardHtml = `
        <div class="ledger-stats-grid">
          <div class="ledger-stat-card">
            <div class="ledger-stat-val">${APP_STATE.tickets.length}口</div>
            <div class="ledger-stat-lbl">累計記録数</div>
          </div>
          <div class="ledger-stat-card">
            <div class="ledger-stat-val" style="color:#FF8585;">${winCount}本</div>
            <div class="ledger-stat-lbl">当選本数</div>
          </div>
          <div class="ledger-stat-card">
            <div class="ledger-stat-val">${winRateStr}</div>
            <div class="ledger-stat-lbl">確定分当選率</div>
          </div>
        </div>
      `;

      const curType = APP_STATE.currentType;
      const curRound = APP_STATE.targetRounds[curType];
      const manualEntryHtml = `
        <div class="manual-entry-panel">
          <button type="button" class="manual-toggle-btn" id="btnToggleManualForm">✍️ マイ買い目（自己選択数字）を手入力追加</button>
          <div class="manual-form-body" id="manualFormBody">
            <div class="manual-form-grid">
              <select class="manual-input" id="manualTypeSelect">
                <option value="numbers3" ${curType==='numbers3'?'selected':''}>ナンバーズ3</option>
                <option value="numbers4" ${curType==='numbers4'?'selected':''}>ナンバーズ4</option>
                <option value="miniloto" ${curType==='miniloto'?'selected':''}>ミニロト</option>
                <option value="loto6" ${curType==='loto6'?'selected':''}>ロト6</option>
                <option value="loto7" ${curType==='loto7'?'selected':''}>ロト7</option>
                <option value="bingo5" ${curType==='bingo5'?'selected':''}>ビンゴ5</option>
              </select>
              <input type="number" class="manual-input" id="manualRoundInput" value="${curRound}" placeholder="回号 (例: 2150)">
            </div>
            <div class="manual-form-grid" id="manualBetRow">
              <select class="manual-input" id="manualBetSelect">
                <option value="ボックス">ボックス</option>
                <option value="ストレート">ストレート</option>
                <option value="セット">セット</option>
                <option value="ミニ">ミニ (N3のみ・下2桁可)</option>
              </select>
              <div style="font-size:10px; color:var(--ink-muted); display:flex; align-items:center;">※ロト系は買い方自動省略</div>
            </div>
            <input type="text" class="manual-input" id="manualNumsInput" style="margin-bottom:7px;" placeholder="数字をスペースやカンマ区切りで入力 (例: 3 12 19 25 33 41)">
            <button type="button" class="restore-exec-btn" id="btnSubmitManualTicket">＋ この買い目を台帳へ保存</button>
          </div>
        </div>
      `;

      const filterRowHtml = `
        <div class="ledger-filter-row">
          <select class="ledger-filter-select" id="filterTypeSelect">
            <option value="ALL" ${APP_STATE.ledgerFilterType==='ALL'?'selected':''}>すべての宝くじ</option>
            <option value="numbers3" ${APP_STATE.ledgerFilterType==='numbers3'?'selected':''}>ナンバーズ3</option>
            <option value="numbers4" ${APP_STATE.ledgerFilterType==='numbers4'?'selected':''}>ナンバーズ4</option>
            <option value="miniloto" ${APP_STATE.ledgerFilterType==='miniloto'?'selected':''}>ミニロト</option>
            <option value="loto6" ${APP_STATE.ledgerFilterType==='loto6'?'selected':''}>ロト6</option>
            <option value="loto7" ${APP_STATE.ledgerFilterType==='loto7'?'selected':''}>ロト7</option>
            <option value="bingo5" ${APP_STATE.ledgerFilterType==='bingo5'?'selected':''}>ビンゴ5</option>
          </select>
          <select class="ledger-filter-select" id="filterStatusSelect">
            <option value="ALL" ${APP_STATE.ledgerFilterStatus==='ALL'?'selected':''}>すべての結果</option>
            <option value="win" ${APP_STATE.ledgerFilterStatus==='win'?'selected':''}>🎉 当選のみ</option>
            <option value="pending" ${APP_STATE.ledgerFilterStatus==='pending'?'selected':''}>⏳ 抽選待ち</option>
            <option value="lose" ${APP_STATE.ledgerFilterStatus==='lose'?'selected':''}>落選のみ</option>
          </select>
        </div>
      `;

      const backupSectionHtml = `
        <div class="backup-panel">
          <div class="backup-title">💾 端末容量ゼロ・クリップボード式データ保全</div>
          <div class="backup-btn-row">
            <button type="button" class="backup-action-btn" id="btnExportBackup">📋 バックアップコピー</button>
            <button type="button" class="backup-action-btn" id="btnToggleRestore">📥 コードから復元</button>
          </div>
          <div class="restore-box" id="restoreInputBox">
            <textarea class="restore-textarea" id="restoreCodeInput" placeholder="ここに LOTTO_BK_... で始まるバックアップコードを貼り付けてください"></textarea>
            <button type="button" class="restore-exec-btn" id="btnExecRestore">復元して最新当選結果と再照合</button>
          </div>
        </div>
      `;

      const filteredTickets = APP_STATE.tickets.filter(t => {
        if (APP_STATE.ledgerFilterType !== 'ALL' && t.type !== APP_STATE.ledgerFilterType) return false;
        if (APP_STATE.ledgerFilterStatus !== 'ALL') {
          const st = evaluateTicketMatch(t).status;
          if (st !== APP_STATE.ledgerFilterStatus) return false;
        }
        return true;
      });

      let ticketsListHtml = '';
      if (APP_STATE.tickets.length === 0) {
        ticketsListHtml = `<div style="text-align:center; padding:20px 12px; color:var(--ink-muted); font-size:12.5px;">まだ購入台帳に記録された買い目はありません。<br>予測カードの「＋ 購入台帳に記録」または上の手入力から保存できます。</div>`;
      } else if (filteredTickets.length === 0) {
        ticketsListHtml = `<div style="text-align:center; padding:20px 12px; color:var(--ink-muted); font-size:12.5px;">選択中のフィルター条件に一致する記録はありません。</div>`;
      } else {
        ticketsListHtml = filteredTickets.map(ticket => {
          const evalRes = evaluateTicketMatch(ticket);
          const off = evalRes.official;
          const type = ticket.type;

          let userVisualHtml = '';
          let officialRefHtml = '';

          if (type === 'bingo5') {
            const n = ticket.numbers;
            const cells = [
              { v: n[0], slot: 0 }, { v: n[1], slot: 1 }, { v: n[2], slot: 2 },
              { v: n[3], slot: 3 }, { v: 'FREE', slot: -1 }, { v: n[4], slot: 4 },
              { v: n[5], slot: 5 }, { v: n[6], slot: 6 }, { v: n[7], slot: 7 }
            ];
            userVisualHtml = `
              <div style="margin:6px 0;">
                <div class="bingo-mini-3x3">
                  ${cells.map(c => {
                    if (c.v === 'FREE') return `<div class="bingo-mini-cell free">FREE</div>`;
                    const isHit = off && off.main[c.slot] === c.v;
                    return `<div class="bingo-mini-cell ${isHit ? 'hit-cell' : ''}">${String(c.v).padStart(2, '0')}</div>`;
                  }).join('')}
                </div>
              </div>
            `;
            if (off) {
              const on = off.main;
              const oCells = [on[0], on[1], on[2], on[3], 'FREE', on[4], on[5], on[6], on[7]];
              officialRefHtml = `
                <div class="ledger-official-ref">
                  <div style="margin-bottom:4px; font-weight:700;">公式当選（📅 ${off.date}）：</div>
                  <div class="bingo-mini-3x3">
                    ${oCells.map(v => v === 'FREE'
                      ? `<div class="bingo-mini-cell free">FREE</div>`
                      : `<div class="bingo-mini-cell">${String(v).padStart(2, '0')}</div>`
                    ).join('')}
                  </div>
                </div>
              `;
            }
          } else {
            const coinsHtml = ticket.numbers.map((num, idx) => {
              if (num === null) {
                return `<span class="ledger-coin is-wildcard">*</span>`;
              }
              const disp = (type === 'numbers3' || type === 'numbers4') ? String(num) : String(num).padStart(2, '0');
              let isMainHit = false;
              let isBonusHit = false;
              if (off) {
                if (type === 'numbers3' || type === 'numbers4') {
                  if (ticket.betType === 'ボックス' || ticket.betType === 'セット') {
                    isMainHit = off.main.includes(num);
                  } else if (ticket.betType === 'ミニ' && type === 'numbers3') {
                    isMainHit = (idx === 1 || idx === 2) && off.main[idx] === num;
                  } else {
                    isMainHit = off.main[idx] === num;
                  }
                } else {
                  isMainHit = off.main.includes(num);
                  if (!isMainHit && off.bonus && off.bonus.includes(num)) {
                    isBonusHit = true;
                  }
                }
              }
              const cls = ['ledger-coin', isMainHit ? 'hit-main' : '', isBonusHit ? 'hit-bonus' : ''].filter(Boolean).join(' ');
              return `<span class="${cls}">${disp}</span>`;
            }).join('');

            userVisualHtml = `<div class="ledger-coins-row">${coinsHtml}</div>`;

            if (off) {
              const offMainStr = (type === 'numbers3' || type === 'numbers4')
                ? off.main.join(' - ')
                : off.main.map(v => String(v).padStart(2, '0')).join(' - ');
              const offBonusStr = (off.bonus && off.bonus.length > 0)
                ? `　B: (${off.bonus.map(b => String(b).padStart(2, '0')).join(', ')})`
                : '';
              officialRefHtml = `
                <div class="ledger-official-ref">
                  <strong>公式当選（📅 ${off.date}）：</strong>${offMainStr}${offBonusStr}
                </div>
              `;
            }
          }

          const betTagHtml = ticket.betType
            ? `<span class="bet-mode-tag">${ticket.betType}</span>`
            : '';

          return `
            <div class="ticket-item">
              <div class="ticket-top">
                <span class="ticket-title">${ticket.typeName} 第${ticket.round}回（${ticket.rank}）${betTagHtml}</span>
                <span class="ticket-status-badge ${evalRes.status}">${evalRes.label}</span>
              </div>
              ${userVisualHtml}
              ${officialRefHtml}
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                <span style="font-size:10.5px; color:var(--ink-muted);">記録日: ${ticket.savedAt}</span>
                <button type="button" class="ticket-del-btn" data-del-id="${ticket.id}">削除</button>
              </div>
            </div>
          `;
        }).join('');
      }

      body.innerHTML = statsDashboardHtml + manualEntryHtml + filterRowHtml + backupSectionHtml + ticketsListHtml;
      bindLedgerModalEvents();
      document.getElementById('ledgerModal').classList.add('open');
    }

    function bindLedgerModalEvents() {
      const body = document.getElementById('ledgerModalBody');
      const btnExp = document.getElementById('btnExportBackup');
      const btnTog = document.getElementById('btnToggleRestore');
      const btnExec = document.getElementById('btnExecRestore');
      const btnManualTog = document.getElementById('btnToggleManualForm');
      const btnManualSub = document.getElementById('btnSubmitManualTicket');
      const fType = document.getElementById('filterTypeSelect');
      const fStatus = document.getElementById('filterStatusSelect');

      if (btnManualTog) {
        btnManualTog.addEventListener('click', () => {
          SOUND_FX.play('modal');
          document.getElementById('manualFormBody').classList.toggle('open');
        });
      }

      if (btnManualSub) {
        btnManualSub.addEventListener('click', () => {
          const mType = document.getElementById('manualTypeSelect').value;
          const mRound = Number(document.getElementById('manualRoundInput').value);
          const mBet = document.getElementById('manualBetSelect').value;
          const rawStr = document.getElementById('manualNumsInput').value.trim();
          const cfg = LOTTERY_CONFIG[mType];

          if (!mRound || mRound <= 0) {
            SOUND_FX.play('limit');
            showToast('有効な回号を入力してください');
            return;
          }

          let parsedNums = [];
          if ((mType === 'numbers3' || mType === 'numbers4') && /^\d+$/.test(rawStr)) {
            parsedNums = rawStr.split('').map(Number);
          } else {
            parsedNums = rawStr.split(/[\s,、・\-]+/).filter(Boolean).map(Number);
          }

          if (mType === 'numbers3' && mBet === 'ミニ' && parsedNums.length === 2 && !parsedNums.some(n => isNaN(n) || n < 0 || n > 9)) {
            parsedNums = [null, parsedNums[0], parsedNums[1]];
          } else if (parsedNums.length !== cfg.pick || parsedNums.some(n => isNaN(n) || n < cfg.min || n > cfg.max)) {
            SOUND_FX.play('limit');
            showToast(`${cfg.name}は ${cfg.min}〜${cfg.max} の数字を ${cfg.pick}個 入力してください`);
            return;
          }

          if (!cfg.allowDuplicates && new Set(parsedNums).size !== cfg.pick) {
            SOUND_FX.play('limit');
            showToast(`${cfg.name}は重複しない数字を${cfg.pick}個入力してください`);
            return;
          }

          if (cfg.sorted) {
            parsedNums.sort((a, b) => a - b);
          }

          const finalBet = (mType === 'numbers3' || mType === 'numbers4')
            ? (mType === 'numbers4' && mBet === 'ミニ' ? 'ボックス' : mBet)
            : null;

          const ticket = {
            id: Date.now() + '_' + Math.floor(Math.random() * 100000),
            type: mType,
            typeName: cfg.name,
            round: mRound,
            rank: '手入力マイ買い目',
            betType: finalBet,
            numbers: parsedNums,
            savedAt: formatDateWithWeekday(new Date())
          };
          APP_STATE.tickets.unshift(ticket);
          persistTickets();
          updateLedgerBadge();
          SOUND_FX.play('coin');
          openLedgerModal();
          showToast(`✍️ ${cfg.name} 第${mRound}回のマイ買い目を台帳に追加しました`);
        });
      }

      if (fType) {
        fType.addEventListener('change', () => {
          SOUND_FX.play('step');
          APP_STATE.ledgerFilterType = fType.value;
          saveSessionState();
          openLedgerModal();
        });
      }

      if (fStatus) {
        fStatus.addEventListener('change', () => {
          SOUND_FX.play('step');
          APP_STATE.ledgerFilterStatus = fStatus.value;
          saveSessionState();
          openLedgerModal();
        });
      }

      if (btnExp) btnExp.addEventListener('click', exportBackupCode);
      if (btnTog) {
        btnTog.addEventListener('click', () => {
          SOUND_FX.play('modal');
          document.getElementById('restoreInputBox').classList.toggle('open');
        });
      }
      if (btnExec) {
        btnExec.addEventListener('click', () => {
          const val = document.getElementById('restoreCodeInput').value;
          importBackupCode(val);
        });
      }

      body.querySelectorAll('.ticket-del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          SOUND_FX.play('clear');
          const id = btn.dataset.delId;
          APP_STATE.tickets = APP_STATE.tickets.filter(t => t.id !== id);
          persistTickets();
          updateLedgerBadge();
          openLedgerModal();
        });
      });
    }

    /* ================= 14-DAY LUCKY CALENDAR MODAL (COMPACT 2-ROW) ================= */
    function openCalendarModal() {
      const body = document.getElementById('calendarModalBody');
      const today = new Date();
      let html = '<div class="calendar-list">';

      for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dateLabel = formatDateWithWeekday(d);
        const info = getAuspiciousInfoForDate(d);

        const isSuper = info.rokuyo === '大安' || info.tags.length > 0 || info.moonTags.length > 0;

        const drawsHtml = info.draws.length > 0
          ? info.draws.map(dr => `<span class="draw-lotto-chip ${dr.major ? 'major' : ''}">${dr.name}</span>`).join('')
          : `<span class="draw-none-text">抽選なし</span>`;

        html += `
          <div class="cal-row ${isSuper ? 'super-lucky' : ''}">
            <div class="cal-top-line">
              <span class="cal-date-str">${dateLabel}</span>
              <div class="cal-badges">
                ${info.tags.map(t => `<span class="auspicious-tag">✨${t}</span>`).join('')}
                ${info.moonTags.map(m => `<span class="moon-tag">${m}</span>`).join('')}
                <span class="rokuyo-pill ${info.rokuyo === '大安' ? 'taian' : ''}">${info.rokuyo}</span>
              </div>
            </div>
            <div class="cal-bottom-line">
              <div class="cal-draws-group">
                <span class="cal-draws-label">🎯抽選:</span>
                ${drawsHtml}
              </div>
              <span class="cal-lunar-inline">${info.lunarStr}</span>
            </div>
          </div>
        `;
      }
      html += '</div>';
      body.innerHTML = html;
      document.getElementById('calendarModal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    /* ================= EVENT LISTENERS ================= */
    document.getElementById('toggleSoundBtn').addEventListener('click', () => {
      APP_STATE.soundEnabled = !APP_STATE.soundEnabled;
      try {
        localStorage.setItem('lottery_pred_sound_v1', String(APP_STATE.soundEnabled));
      } catch (e) {}
      updateSoundButtonUI();
      if (APP_STATE.soundEnabled) {
        SOUND_FX.play('axis');
        showToast('🔊 ボタン効果音をONにしました');
      } else {
        showToast('🔇 ボタン効果音をOFF（消音）にしました');
      }
    });

    document.getElementById('btnN3Standard').addEventListener('click', () => {
      if (!APP_STATE.n3MiniMode) return;
      SOUND_FX.play('step');
      APP_STATE.n3MiniMode = false;
      renderAll();
      showToast('🎲 ナンバーズ3：通常3桁予測モードへ切り替えました');
    });

    document.getElementById('btnN3Mini').addEventListener('click', () => {
      if (APP_STATE.n3MiniMode) return;
      SOUND_FX.play('axis');
      APP_STATE.n3MiniMode = true;
      renderAll();
      showToast('🎯 ナンバーズ3：ミニ（下2桁特化）予測モードへ切り替えました');
    });

    document.querySelectorAll('.lottery-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        SOUND_FX.play('tab');
        APP_STATE.currentType = btn.dataset.type;
        APP_STATE.selectedRound = APP_STATE.targetRounds[APP_STATE.currentType];
        APP_STATE.isCustomMode = false;
        APP_STATE.customSeedOffset = 0;
        updateSyncStatusUI();
        renderAll();
      });
    });

    document.getElementById('prevRoundBtn').addEventListener('click', () => {
      SOUND_FX.play('step');
      APP_STATE.selectedRound--;
      renderAll();
    });

    document.getElementById('nextRoundBtn').addEventListener('click', () => {
      const target = APP_STATE.targetRounds[APP_STATE.currentType];
      if (APP_STATE.selectedRound < target) {
        SOUND_FX.play('step');
        APP_STATE.selectedRound++;
        renderAll();
      }
    });

    document.getElementById('latestRoundBtn').addEventListener('click', () => {
      SOUND_FX.play('step');
      APP_STATE.selectedRound = APP_STATE.targetRounds[APP_STATE.currentType];
      renderAll();
      showToast(`最新購入対象（第${APP_STATE.selectedRound}回）へ戻りました`);
    });

    document.getElementById('toggleConditionBtn').addEventListener('click', () => {
      SOUND_FX.play('modal');
      document.getElementById('conditionDrawer').classList.toggle('open');
      updateConditionSummaryPill();
      saveSessionState();
    });

    document.getElementById('btnPresetExcludeLast').addEventListener('click', applyPresetExcludeLastDraw);
    document.getElementById('btnPresetDroughtAxis').addEventListener('click', applyPresetTopDroughtAxis);

    document.getElementById('clearConditionsBtn').addEventListener('click', () => {
      SOUND_FX.play('clear');
      const type = APP_STATE.currentType;
      if (type === 'bingo5') {
        APP_STATE.conditions.bingo5 = { axis: Array(8).fill(null), exclude: Array(8).fill(null), bypassExcludeLimit: false };
      } else {
        APP_STATE.conditions[type] = { axis: [], exclude: [], bypassExcludeLimit: false };
      }
      renderConditionPad();
      updateConditionSummaryPill();
      saveSessionState();
      showToast('指定条件をすべて解除しました');
    });

    document.getElementById('runPredictBtn').addEventListener('click', () => {
      SOUND_FX.play('predict');
      APP_STATE.isCustomMode = true;
      APP_STATE.customSeedOffset += 1;
      renderAll();
      showToast('ハイブリッド統計＆指定条件を反映した再抽選を実行しました');
    });

    document.getElementById('resetOfficialBtn').addEventListener('click', () => {
      SOUND_FX.play('clear');
      APP_STATE.isCustomMode = false;
      APP_STATE.customSeedOffset = 0;
      renderAll();
      showToast('全期間累積統計の「公式本命」へ戻しました');
    });

    document.getElementById('openHistoryBtn').addEventListener('click', () => {
      SOUND_FX.play('modal');
      openHistoryModal();
    });
    document.getElementById('openLedgerBtn').addEventListener('click', () => {
      SOUND_FX.play('modal');
      openLedgerModal();
    });
    document.getElementById('openCalendarBtn').addEventListener('click', () => {
      SOUND_FX.play('modal');
      openCalendarModal();
    });

    document.querySelectorAll('.modal-close-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        SOUND_FX.play('clear');
        closeModal(btn.dataset.close);
      });
    });

    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) {
          SOUND_FX.play('clear');
          backdrop.classList.remove('open');
        }
      });
    });

    // Boot
    initializeData();
  </script>
</body>
</html>
